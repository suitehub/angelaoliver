name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build || true

      - name: Prepare GitHub Pages artifact
        run: |
          OUT=".output/public"
          if [ -d "dist/client" ]; then
            rm -rf "$OUT"
            mkdir -p "$OUT"
            cp -r dist/client/* "$OUT/"
          fi
          if [ ! -f "$OUT/index.html" ]; then
            node -e "
              const fs=require('fs'); const p='$OUT/assets';
              const files=fs.existsSync(p)?fs.readdirSync(p):[];
              const css=files.filter(f=>f.endsWith('.css')).map(f=>'<link rel=\"stylesheet\" href=\"/angelaoliver/assets/'+f+'\">').join('\n');
              const js=files.filter(f=>f.endsWith('.js')).map(f=>'<script type=\"module\" src=\"/angelaoliver/assets/'+f+'\"></script>').join('\n');
              const html='<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"UTF-8\"/><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/><title>Angela Oliver</title><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap\">'+css+'</head><body><div id=\"root\"></div>'+js+'</body></html>';
              fs.writeFileSync('$OUT/index.html', html);
            "
          fi
          cp "$OUT/index.html" "$OUT/404.html"
          test -f "$OUT/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
